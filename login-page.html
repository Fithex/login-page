<!DOCTYPE html>
<html>

<head>
    <title>Page Title</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <h1 class="heading">AYETIS</h1>

    <div class="all">
        <div class="glass-card">
            <h1>Sign In</h1>
            <p>Don't have an account? <a href="http://localhost:5173/register?type=individual">Register here</a></p>
            <div class="client">Individual Client</div>
            <form>
                <label for="fname">Email:</label><br>
                <input class="Frame-size" type="text" id="fname" name="fname"><br>
                <label for="lname">Password:</label><br>
                <input class="Frame-size" type="password" id="lname" name="lname"><br>
                <p class="forgot-password"><a href="http://localhost:5173/register?type=individual">Forgot Password?</a>
                </p>
                <input class="signin" type="submit" value="Sign In Securely"
                    onclick="alert('Sign in clicked!'); return false;">
            </form>
        </div>
    </div>

</body>

</html>
